[project]
name = "withholding-debate"
version = "0.1.0"
description = "Reproduction pipeline for 'Multi-agent discussion gains less when dissent is withheld'"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "matplotlib==3.11.2",
    "pyyaml",
    "snakemake>=8",
    "polyagamma",
    "pulp<2.8",
    "cbrm",
]

[tool.uv]
package = false

[tool.uv.sources]
cbrm = { path = "libs/cbrm", editable = true }
